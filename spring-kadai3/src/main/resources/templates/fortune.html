<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>占い</title>
</head>
<body>
  <h1>占いたい月を入力してね</h1>
  <form action="/fortune" method="get">
    <label>
      <select name="month">
        <option th:each="i : ${#numbers.sequence(1,12)}" th:value="${i}" th:text="${i}"></option>
      </select>月
    </label>
    <label>
      <button>占ってみる</button>
    </label>
  </form>
  <br>
  <!-- 結果表示 (monthが存在する時のみ表示するようにする)-->
   <div th:if="${fortune != null}">
    <p th:text="${fortune.month} + '月の運勢は、、、'"></p>
    <ul>
      <!-- Modelのgetterを使用して値を取得 -->
      <li th:text="'ラッキーアイテム: ' + ${fortune.luckyItem}"></li>
      <li th:text="'ラッキーカラー: ' + ${fortune.luckyColor}"></li>
      <li th:text="'順位: ' + ${fortune.ranking}"></li>
    </ul>
   </div>
</body>
</html>
